<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
 <link rel="stylesheet" href="index.css">
    <title>FORM PAGE</title>
</head>

<body>
    <form action="">
        <p>
            <label for="name">Name<br>
                <input id="name" title="Enter your first and last name" type="text" placeholder="Enter your Name"></p>
            </label>
            
        <p>
            <input type="tel" placeholder="Enter your phonenumber"></p>
        <p><input type="email" placeholder="Enter your email"></p>
        <p><input title="Your password must be greater than 8 character, 5 uppercase letter, 5 lowercase letter"
                type="password" placeholder="Enter your password"></p>
        <p>
            <select title="A select box for you to choose your state">
                <option value="">Select your state</option>
                <option value="Abia">Abia</option>
                <option value="Adamawa">Adamawa</option>
                <option value="Akwa-ibom">Akwa-ibom</option>
                <option value="Anambra">Anambra</option>
            </select>
        </p>
        <p>
            <input type="radio" value="male" name="gender">male
            <input type="radio" value="female">female
        </p>
        <p>Select your courses for the semester</br>
          <input type="checkbox" name="courses" value="HTML">HTML</br>
            <input type="checkbox" name="courses" value="CSS">css</br>
            <input type="checkbox" name="courses" value="javaScript">javaScript</br>
            <input type="checkbox" name="courses" value="Reactjs">Reactjs</br>
            <p> <textarea cols="10" rows="10" placeholder="other details"></textarea></p>
            <button>summit</button>
    </form>
</body>
